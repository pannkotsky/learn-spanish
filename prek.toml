# https://prek.j178.dev/configuration/
# Install hooks: `pnpm install` (prepare) or `pnpm exec prek install`

[[repos]]
repo = "local"

[[repos.hooks]]
id = "typescript"
name = "TypeScript (tsc --noEmit)"
language = "system"
entry = "pnpm ts"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "format-check"
name = "Format check (fails if formatting would change files)"
language = "system"
entry = "pnpm format:check"
pass_filenames = false
always_run = true

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "trailing-whitespace"
